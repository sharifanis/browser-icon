name: Publish Package to npm

on:
  push:
    branches:
      - main  # Set to the branch you want to publish from (e.g., main or master)

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '16'  # Use your required Node.js version

    - name: Install dependencies
      run: npm install

    - name: Publish to npm
      run: npm publish --access public
      env:
        NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}  # Set up your npm token in GitHub secrets
